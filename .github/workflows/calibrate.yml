name: Calibrate (anchor days)

# Tap "Run workflow" after filling observed_max_cm in anchor_days.csv.
# Diagnostic only -- prints the table to the log and uploads results.txt.
# Does NOT commit anything back to the repo.
on:
  workflow_dispatch:

jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: System libraries (eccodes / geos / proj)
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes0 libgeos-dev libproj-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install shapely   # for the Belgium polygon mask

      - name: Run calibration
        run: python calibrate.py

      - name: Upload results table
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibration-results
          path: results.txt
          if-no-files-found: warn
