name: Belgium hail map

# Run it from your phone with the "Run workflow" button (workflow_dispatch),
# and automatically every morning once the 00Z GFS run has finished.
on:
  workflow_dispatch:        # manual trigger (the button)
    inputs:
      run_date:
        description: "GFS run date YYYY-MM-DD (blank = today UTC)"
        required: false
        default: ""
  schedule:
    - cron: "0 6 * * *"     # 06:00 UTC daily; 00Z GFS f015 is out well before this

permissions:
  contents: write           # needed to commit output/latest.png back to the repo

# Only one run at a time, so runs can't race each other to push to main.
concurrency:
  group: belgium-hail-map
  cancel-in-progress: false  # queue a second trigger rather than killing a run mid-download

jobs:
  build-map:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: System libraries (eccodes / geos / proj for cfgrib + cartopy)
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes0 libgeos-dev libproj-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build the map
        env:
          RUN_HOUR: "0"
          VALID_HOUR: "15"
          RUN_DATE: ${{ github.event.inputs.run_date }}
        run: python belgium_hail_map.py

      - name: Upload PNG as artifact
        uses: actions/upload-artifact@v4
        with:
          name: belgium-hail-map
          path: output/*.png
          if-no-files-found: error

      - name: Commit latest.png back to the repo (for easy phone viewing)
        run: |
          git config user.name  "hail-map-bot"
          git config user.email "actions@github.com"
          git add output/*.png
          if git diff --cached --quiet; then
            echo "No change to commit."
            exit 0
          fi
          git commit -m "Update Belgium hail map ($(date -u +%Y-%m-%dT%H:%MZ))"
          # Remote may have advanced (another run, or a source edit). Try to
          # push; if rejected, rebase our commit onto the latest remote and retry.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected; syncing with remote (attempt $attempt)..."
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            sleep 3
          done
          echo "Could not push after 5 attempts." >&2
          exit 1
